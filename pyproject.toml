[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wordfreq"
version = "0.1.0"
description = "Word frequency counts for text files, with stopwords, n-grams and a terminal bar chart."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Boyan253/wordfreq"

[project.scripts]
wordfreq = "wordfreq:main"

[tool.setuptools]
py-modules = ["wordfreq"]
